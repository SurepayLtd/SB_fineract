dependencies {
    implementation project(':fineract-core')
    if (System.getProperty("idea.sync.active") == "true" || System.getProperty("idea.active") == "true" || Boolean.getBoolean("idea.active")) {
        implementation project(':fineract-provider')
    } else {
        implementation project(':fineract-provider').sourceSets.main.output
    }
    implementation project(':fineract-loan')
    implementation project(':fineract-savings')
    implementation project(':fineract-accounting')
    implementation project(':fineract-branch')
    implementation project(':fineract-document')
    implementation project(':fineract-investor')
    implementation project(':fineract-rates')
    implementation project(':fineract-charge')
    implementation project(':fineract-tax')
    implementation project(':fineract-report')
    implementation project(':fineract-progressive-loan')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'org.apache.commons:commons-text'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.eclipse.persistence:org.eclipse.persistence.jpa'
    implementation 'jakarta.servlet:jakarta.servlet-api'
    implementation 'io.micrometer:micrometer-core'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api'
    implementation 'org.glassfish.jersey.media:jersey-media-multipart'
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta'
    implementation 'com.google.code.gson:gson'
    implementation 'com.google.truth:truth:1.4.5'
    implementation 'org.mapstruct:mapstruct'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor'

    testImplementation ('io.rest-assured:rest-assured') {
        exclude group: 'org.apache.groovy'
        exclude group: 'org.codehaus.groovy'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
}
