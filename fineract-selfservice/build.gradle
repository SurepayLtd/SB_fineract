description = 'Fineract Self Service Module'

apply plugin: 'java'
apply plugin: 'eclipse'

apply from: 'dependencies.gradle'

/* http://stackoverflow.com/questions/19653311/jpa-repository-works-in-idea-and-production-but-not-in-gradle */
sourceSets.main.output.resourcesDir = sourceSets.main.java.classesDirectory
sourceSets.test.output.resourcesDir = sourceSets.test.java.classesDirectory

compileJava {
    options.annotationProcessorPath = configurations.annotationProcessor
}

tasks.named('test') {
    dependsOn tasks.named('jar')
    
    // Forward all command-line system properties (e.g. -Dkey=val) to the test execution JVM
    systemProperties = System.getProperties() as Map<String, ?>
    
    // Forward project properties like cargoDisabled
    if (project.hasProperty('cargoDisabled')) {
        systemProperty 'cargoDisabled', 'true'
    }
}
